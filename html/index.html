<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classic Pikachu Game</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
</head>
<body>

<div class="game-container container">
    <header class="game-header">
        <section class="game-logo fw-bold text-lg-center">
            <img class="game-icon" src="../assets/img/pikachu.png" alt="Pikachu">
            <h4 class="fw-bold mt-2">PikaMatch Arcade</h4>
        </section>

        <section class="game-utility">
            <i class="fa-solid fa-volume"></i>
        </section>
    </header>

    <main class="game-main">
        <section class="game-intro game-box">
            <div class="game-intro__container">
                <div class="current-level game-box">
                    <span class="current-level__title">MÀN</span>
                    <span class="current-level__value">1</span>
                </div>

                <div class="game-score game-box d-flex align-items-center justify-content-center">
                    <i class="fa-solid fa-trophy me-3"></i>
                    <div class="score">
                        <span>ĐIỂM</span>
                        <span>1,0000</span>
                    </div>
                </div>

                <div class="game-timer game-box">
                    <div class="game-timer__text mb-2">
                        <i class="fa-regular fa-alarm-clock"></i>
                        <span class="game-timer__text-value fw-bold">2:20</span>
                    </div>
                    <div class="game-timer__value">
                        <div class="game-timer__current-value"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="game-body row g-0">
            <div class="level-panel col-3 pe-3">
                <div class="level-content box-container__shadow p-3">LEVEL 1</div>
            </div>

            <div class="game-board col-9">
                <div class="board-content box-container__shadow p-3">PIKKK</div>
            </div>
        </section>

        <section
                class="game-controls box-container__shadow row g-0 p-3 d-flex justify-content-between align-items-center">
            <button type="button" class="btn col-2 me-1">
                <i class="fa-solid fa-lightbulb"></i> Gợi ý
            </button>
            <button type="button" class="btn col-2 me-1">
                <i class="fa-solid fa-shuffle"></i>
                Đổi vị trí
            </button>
            <button type="button" class="btn col-2 me-1">
                <i class="fa-solid fa-pause"></i>
                Tạm dừng
            </button>
            <button type="button" class="btn col-2 me-1">
                <i class="fa-solid fa-rotate-left"></i>
                Chơi lại
            </button>
            <button type="button" class="btn col-2 me-1">
                <i class="fa-solid fa-forward-fast"></i>
                Bỏ qua
            </button>
        </section>
    </main>

    <footer class="game-footer">
        <div class="game-footer-content row g-0">
            <span>© Copyright 2010 - 2026 PikaMatch.net</span>
        </div>
    </footer>

</div>

<script src="../assets/jquery/jquery-4.0.0.min.js"></script>
<script src="../assets/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script>

</body>
</html>
