<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classic Pikachu Game</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
    <link rel="icon" type="image/png" href="../assets/img/favicon.jpg">
</head>
<body>

<div class="game-container container">
<!--    <header class="game-header">-->
<!--        <section class="game-logo fw-bold text-lg-center">-->
<!--            <img class="game-icon" src="../assets/img/pikachu.png" alt="Pikachu">-->
<!--            <h4 class="fw-bold mt-2 text-light ms-2">PikaMatch Arcade</h4>-->
<!--        </section>-->

<!--        <section class="game-utility">-->
<!--            <button class="utility-items">-->
<!--                <i class="fa-solid fa-volume"></i>-->
<!--            </button>-->
<!--        </section>-->
<!--    </header>-->

    <main class="game-main">
        <section class="game-intro game-box">
            <div class="game-intro__container">
                <div class="game-info-value current-level game-box">
                    <span class="current-level__title text-light">MÀN</span>
                    <span class="current-level__value text-dark-gray">1</span>
                </div>

                <div class="game-score game-box d-flex align-items-center justify-content-center">
                    <i class="fa-solid fa-trophy me-3"></i>
                    <div class="game-info-value score">
                        <span class="score-title text-light">ĐIỂM</span>
                        <span class="score-value">0</span>
                    </div>
                </div>

                <div class="game-score record game-box d-flex align-items-center justify-content-center">
                    <i class="fa-solid fa-medal me-3"></i>
                    <div class="game-info-value score">
                        <span class="score-title text-light">KỶ LỤC</span>
                        <span class="score-value">0</span>
                    </div>
                </div>

                <div class="game-timer game-box">
                    <div class="game-timer__text mb-2">
                        <i class="fa-regular fa-alarm-clock"></i>
                        <span class="game-timer__text-value fw-bold text-light">2:20</span>
                    </div>
                    <div class="game-timer__value">
                        <div class="game-timer__current-value"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="game-body row g-0">
            <div class="level-panel col-3 pe-3">
                <div class="level-content game-box box-container__shadow">
                    <div class="level-header__container d-flex align-items-center justify-content-between">
                        <div class="level-title text-light">
                            <i class="fs-5 fa-regular fa-map"></i>
                            <span class="fs-5 text-light fw-bold">Bản đồ</span>
                        </div>
                    </div>

                    <div class="separator"></div>

                    <div class="level-body mt-2">
                        <ul class="level-list mt-4">
                            <li class="level-list__item" data-level="1">
                                <button type="button" class="game-btn active">
                                    <i class="fa-solid fa-circle-play "></i>
                                    <span class="fw-bold text-light">
                                        Màn 1
                                    </span>
                                </button>
                            </li>

                            <li class="level-list__item" data-level="2">
                                <button type="button" class="game-btn">
                                    <i class="fa-solid fa-circle-play"></i>
                                    <span class="fw-bold text-light">
                                        Màn 2
                                    </span>
                                </button>
                            </li>

                            <li class="level-list__item" data-level="3">
                                <button type="button" class="game-btn">
                                    <i class="fa-solid fa-circle-play"></i>
                                    <span class="fw-bold text-light">
                                        Màn 3
                                    </span>
                                </button>
                            </li>

                            <li class="level-list__item" data-level="4">
                                <button type="button" class="game-btn">
                                    <i class="fa-solid fa-circle-play"></i>
                                    <span class="fw-bold text-light">
                                            Màn 4
                                        </span>
                                </button>
                            </li>

                            <li class="level-list__item" data-level="5">
                                <button type="button" class="game-btn">
                                    <i class="fa-solid fa-circle-play"></i>
                                    <span class="fw-bold text-light">
                                        Màn 5
                                    </span>
                                </button>
                            </li>

                            <li class="level-list__item" data-level="6">
                                <button type="button" class="game-btn">
                                    <i class="fa-solid fa-circle-play"></i>
                                    <span class="fw-bold text-light">
                                        Màn 6
                                    </span>
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="game-board col-9">
                <div class="board-content game-box box-container__shadow">
                    <div class="board__container" id="pokemon-board">
                        <div id="connection-layer"></div>
                    </div>
                </div>
            </div>
        </section>

        <section
                class="game-controls game-box box-container__shadow row g-0 p-3 d-flex justify-content-between align-items-center">
            <button type="button" class="game-btn suggest-btn col-2 me-1">
                <i class="fa-solid fa-lightbulb"></i>
                <span class="fw-bold text-light">
                        Gợi ý
                    </span>
            </button>
            <button type="button" class="game-btn shuffle-btn col-2 me-1">
                <i class="fa-solid fa-shuffle"></i>
                <span class="fw-bold text-light">
                    Hoán đổi
                </span>
            </button>
            <button type="button" class="game-btn pause-btn col-2 me-1">
                <i class="fa-regular fa-circle-pause"></i>
                <span class="fw-bold text-light">
                    Tạm dừng
                </span>
            </button>
            <button type="button" class="game-btn col-2 me-1">
                <i class="fa-solid fa-rotate-left text-dark-gray"></i>
                <span class="fw-bold text-light">
                    Chơi lại
                </span>
            </button>
            <button type="button" class="game-btn col-2 me-1">
                <i class="fa-solid fa-forward-fast text-dark-gray"></i>
                <span class="fw-bold text-light">
                    Bỏ qua
                </span>
            </button>
        </section>
    </main>

<!--    <footer class="game-footer">-->
<!--        <div class="game-footer-content row g-0">-->
<!--            <span>© Copyright 2010 - 2026 PikaMatch.net</span>-->
<!--        </div>-->
<!--    </footer>-->

</div>

<script src="../assets/jquery/jquery-4.0.0.min.js"></script>
<script src="../assets/bootstrap/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/main.js"></script>

</body>
</html>
