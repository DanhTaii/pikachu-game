<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classic Pikachu Game</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
</head>
<body>

<div class="game-container container">
    <header class="game-header">
        <section class="game-logo fw-bold text-lg-center">
            <img class="game-icon" src="../assets/img/pikachu.png" alt="Pikachu">
            <h4 class="fw-bold mt-2">PikaMatch Arcade</h4>
        </section>

        <section class="game-utility">
            <i class="fa-solid fa-volume"></i>
        </section>
    </header>

    <main class="game-main">

        <section class="game-intro row g-0">
            <div class="current-level col-2">
                <span class="current-level__title">MÀN </span>
                <span class="current-level__value">1 / 6</span>
            </div>

            <div class="game-score col-2">
                <i class="fa-solid fa-trophy"></i>
            </div>

            <div class="game-timer col-4">
                <div class="game-timer__text">
                    <i class="fa-solid fa-clock"></i>
                    <span class="game-timer__text-value"></span>
                </div>
                <div class="game-timer__value">
                    <div class="game-timer__current-value"></div>
                </div>
            </div>
        </section>

        <section class="level-panel row g-0">
            <div class="game-level col-2 pe-3">
                <div class="level-content box-container__shadow p-3">LEVEL 1</div>
            </div>

            <div class="game-board  col-10">
                <div class="board-content box-container__shadow p-3">PIKKK</div>
            </div>
        </section>

        <section class="game-controls box-container__shadow row g-0 p-3">
            <div class="btn-group" role="group" aria-label="Basic example">
                <button type="button" class="btn btn-primary pe-1">Gợi ý</button>
                <button type="button" class="btn btn-primary">Đổi vị trí</button>
                <button type="button" class="btn btn-primary">Tạm dừng</button>
                <button type="button" class="btn btn-primary">Chơi lại</button>
                <button type="button" class="btn btn-primary">Bỏ qua</button>
            </div>
        </section>

    </main>

    <footer class="game-footer">
        <div class="game-footer-content row g-0">
            <span>© Copyright 2010 - 2026 PikaMatch.net</span>
        </div>
    </footer>

</div>

<script src="../assets/jquery/jquery-4.0.0.min.js"></script>
<script src="../assets/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script>

</body>
</html>
