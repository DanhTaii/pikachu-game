<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classic Pikachu Game</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../assets/bootstrap/bootstrap.min.css">
</head>
<body>

<div class="game-container">
    <header class="game-header">
        <section>
            BÀN
        </section>


    </header>

    <main class="game-main">

        <!-- 1. Test Bootstrap CSS & FontAwesome -->
        <h2 class="text-primary mb-4">
            <i class="fa-solid fa-rocket fa-bounce"></i>
            Nếu chữ màu xanh và có icon tên lửa đang nhảy, CSS & FontAwesome đã nhận!
        </h2>

        <!-- 2. Test Bootstrap JS -->
        <div class="dropdown mb-4">
            <button class="btn btn-success dropdown-toggle" type="button" data-bs-toggle="dropdown">
                Bấm vào đây test Bootstrap JS
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Menu sổ xuống thành công</a></li>
            </ul>
        </div>

        <!-- 3. Test jQuery -->
        <button id="btn-jquery" class="btn btn-warning">Bấm vào đây test jQuery</button>
        <div id="box-jquery" class="mt-3 p-3 bg-danger text-white rounded" style="display: none;">
            jQuery hoạt động ngon lành! (Dùng hiệu ứng slideDown)
        </div>

        <div class="cell">
            <img src="../assets/pokemons/pikachu.png" alt="Pikachu">
        </div>

        <div class="cell">
            <img src="../assets/pokemons/bulbasaur.png" alt="Bulbasaur">
        </div>

        <div class="cell">
            <img src="../assets/pokemons/charmander.png" alt="Charmander">
        </div>

        <div class="cell">
            <img src="../assets/pokemons/squirtle.png" alt="Squirtle">
        </div>

    </main>

    <footer class="game-footer">
        <i class="fa-brands fa-facebook"></i>
        <img src="../assets/pokemons/pikachu.png" alt="Pikachu">
        ÂM THANH
    </footer>

</div>

<script src="../assets/jquery/jquery-4.0.0.min.js"></script>
<script src="../assets/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script>

<!-- Code dùng thử jQuery -->
<script>
    $(document).ready(function() {
        $("#btn-jquery").click(function() {
            $("#box-jquery").slideToggle("fast");
        });
    });
</script>
</body>
</html>
