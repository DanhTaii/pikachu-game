<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classic Pikachu Game</title>

    <style>
        * {
            /*box-sizing: border-box;*/
            font-family: 'Arial', Helvetica, sans-serif;
        }

        .dot {
            background-color: green;
        }

        .cell {
            width: 42px;
            height: 52px;
            border: 2px solid black;

            border-radius: 5px;
        }

        .cell:hover {
            cursor: pointer;
        }

        .cell.empty {
            border: none !important;
            background-image: none;
        }

        .cell.active {
            filter: brightness(60%);
            pointer-events: none;
        }

        .cell.stone {
            background-color: black;
            color: white;
            text-align: center;
        }

        .cell.frozen {
            filter: none;
            border: 2px solid #38bdf8;
            box-shadow: inset 0 0 100px 100px rgba(0, 140, 255, 0.55);
            cursor: not-allowed;
        }

        .cell.hidden {
            filter: brightness(5%);
            cursor: pointer;
        }

        .cell.hidden:hover {
            filter: brightness(100%);
            cursor: pointer;
        }

        .cell.highlight {
            background-color: #fffb00 !important;
            border: 2px solid #ff0000 !important;
            box-shadow: 0 0 10px #ff0000;
        }

        body {
            justify-items: center;
            width: 1200px;
            margin: 0 auto;
            background-color: #F3F7FF;
        }

        .board-container {
            background-color: white;
            border-radius: 10px;
            margin: 36px;
            border: 1px solid #c8c4c4;
        }

        .container {
            display: flex;
            justify-content: center;
        }

        .list-level__container {
            margin-top: 36px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        ul li {
            margin: 10px 0;
            width: 100px;
        }

        button {
            font-size: 15px;
            width: 100%;
            background-color: white;
            border: 1px solid #c8c4c4;
            border-radius: 8px;
            padding: 6px;
        }

        button:hover {
            /*filter: brightness(80%);*/
            transform: translateY(-2px);
        }

        .hint-button {
            background-color: darkblue;
            color: white;
        }

        .hint-button p {
            margin: 2px auto;
        }

        button:hover {
            cursor: pointer;
        }

        .level-button.active {
            background-color: black;
            color: white;
        }

        .game-timer__value {
            margin-top: 50px;
            position: relative;
            width: 60%;
            height: 15px;
            background-color: white;
            /*box-shadow: inset 0 1px 3px ;*/
            border-radius: 50px;
            border: 2px solid black;
        }

        .game-timer__current-value {
            position: absolute;
            background-color: #4769d6;
            width: 100%;
            border-radius: 50px;
            height: 15px;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .guideline {
            border: 1px solid #c8c4c4;
            background-color: white;
            padding: 10px;
            margin: 36px 0;
            height: auto;
            border-radius: 8px;
            width: 200px;
        }

        .guideline .rule-title {
            font-size: 20px;
            font-weight: 600;
            color: darkblue;
        }

        .guideline .rule-subtitle {
            font-weight: 600;
        }

        .level-rule__section .rule-content {
            margin: 12px 0;
            border: 1px solid #c8c4c4;
            border-radius: 8px;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="game-timer__value">
    <div id="current-time" class="game-timer__current-value"></div>
</div>

<div class="container">
    <div class="list-level__container">
        <ul id="list-level">
            <li>
                <button id="hint-button" class="hint-button">
                    <p>GỢI Ý</p>
                    <p id="current-total-hint"></p>
                </button>
            </li>
        </ul>
    </div>

    <div class="board-container">
        <table id="board" style="margin: 0 auto">

        </table>
    </div>


    <div id="guideline" class="guideline">
        <span class="rule-title">HƯỚNG DẪN</span>
        <hr>
        <div id="level-rule__base" class="level-rule__base level-rule__section">
            <div class="rule-subtitle">LUẬT CHUNG:</div>
            <div class="rule-content">Chọn 2 pokemon giống nhau để nối</div>
            <div class="rule-content">Đường nối không được đi xuyên qua Pokémon khác và được rẽ tối đa hai lần (hai góc).</div>
            <div class="rule-content">Ghép hết Pokémon trước khi hết 400 giây thì thắng.</div>
        </div>
        <hr>
        <div id="level-rule__current" class="level-rule__current level-rule__section">
            <div class="rule-subtitle">LUẬT LEVEL HIỆN TẠI:</div>
            <div id="level-rule__content" class="rule-content"></div>
            <div id="level-rule__target" class="rule-content"></div>
        </div>
    </div>
</div>


<script src="game.js"></script>

</body>
</html>
